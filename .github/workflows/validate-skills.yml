name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify repository (M1-M4 scope)
        run: python -m tools.repoctl verify --format json --out .repoctl/runs
      - name: Save native execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repoctl-${{ matrix.os }}
          path: .repoctl/runs/
          include-hidden-files: true
          retention-days: 7
      # Optional gh-skill/host validation is NOT_REQUESTED in the M1-M4 scope.
  validate:
    # Keep the existing status context while requiring every native result.
    if: always()
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Require all native jobs
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: python -c "import os, sys; sys.exit(0 if os.environ['NATIVE_RESULT'] == 'success' else 1)"
