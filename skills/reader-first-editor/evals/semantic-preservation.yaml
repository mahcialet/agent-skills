{
  "suite": "semantic-preservation",
  "cases": [
    {
      "id": "no-invented-deadline-or-owner",
      "language": "ja",
      "mode": "authoring",
      "input": "申請書は速やかに提出してください。",
      "must_preserve": ["申請書", "提出", "依頼"],
      "must_not_add": ["3月31日", "総務部", "担当者"],
      "expected": "期限と提出先を創作せず、不足として明示する"
    },
    {
      "id": "authoring-from-fragmented-brief",
      "language": "ja",
      "mode": "authoring",
      "input": "文書: 管理者向け新機能の告知\n依頼: 告知文の草案作成\n公開時期: 9月予定\n利用条件: 設定変更が必要\n未定: 正確な公開日、設定手順、問い合わせ先",
      "must_preserve": ["管理者向け", "草案", "9月", "予定", "設定変更", "未定"],
      "must_not_add": ["9月1日", "情報システム部", "support@example.com"],
      "expected": "断片的な材料を告知文の草案に整理し、未定の3項目は具体的なplaceholderで示す"
    },
    {
      "id": "no-invented-update-action",
      "language": "en",
      "mode": "revise-safe",
      "input": "The feature may be unavailable during maintenance.",
      "must_preserve": ["may", "during maintenance"],
      "must_not_add": ["update your app", "restart", "contact support"],
      "expected": "不確実性を維持し、新しい行動を追加しない"
    },
    {
      "id": "preserve-condition-exception-negation",
      "language": "ja",
      "mode": "revise-safe",
      "input": "管理者を除き、本人確認が完了していない利用者は申請できません。",
      "must_preserve": ["管理者を除き", "本人確認が完了していない", "申請できません"],
      "must_not_add": [],
      "expected": "例外、条件、否定の範囲を保持する"
    },
    {
      "id": "preserve-modality",
      "language": "en",
      "mode": "revise-safe",
      "input": "Access may be granted after approval.",
      "must_preserve": ["may", "after approval"],
      "must_not_add": ["will", "manager"],
      "expected": "可能性を確実性へ変えずactorを創作しない"
    }
  ]
}
