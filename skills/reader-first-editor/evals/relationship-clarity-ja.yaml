{
  "suite": "relationship-clarity-ja",
  "cases": [
    {
      "id": "flag-ambiguous-seihon",
      "language": "ja",
      "mode": "review",
      "input": "SKILL.mdを正本とする。",
      "must_not_claim": [
        "SKILL.mdだけを直接編集する",
        "ホスト別ファイルをSKILL.mdから生成する",
        "不一致時はSKILL.mdを優先する"
      ],
      "expected": "『正本』を禁止語扱いせず、直接編集するファイル、生成元、不一致時の優先先、共有定義など複数の関係があり得ると診断する。原文は変更せず、一つの意味へ決め打ちしない"
    },
    {
      "id": "no-flag-explicit-precedence",
      "language": "ja",
      "mode": "review",
      "input": "内容が異なる場合は、SKILL.mdの記述を優先する。",
      "expected": "不一致時の優先先が明示されているため、関係の省略として指摘せず、不要な言い換えを求めない"
    },
    {
      "id": "no-flag-explicit-shared-definition",
      "language": "ja",
      "mode": "review",
      "input": "CodexとCopilotが共有する挙動は、SKILL.mdに定義する。ホスト別のコピーは作らない。",
      "expected": "共有する対象と定義場所が明示されているため、追加の抽象語や言い換えを要求しない"
    },
    {
      "id": "preserve-legal-seihon",
      "language": "ja",
      "mode": "review",
      "input": "署名済み契約書の正本を法務部が保管する。",
      "must_preserve": ["署名済み契約書", "正本", "法務部", "保管する"],
      "expected": "法務・記録管理上の具体的な用語として維持し、『原本』『公式版』などへ置き換えず、語の存在だけでは指摘しない"
    },
    {
      "id": "preserve-locally-defined-seihon",
      "language": "ja",
      "mode": "review",
      "input": "本手順では、承認済みPDFを『正本』と呼ぶ。",
      "must_preserve": ["承認済みPDF", "正本"],
      "expected": "対象が文書内で一意に定義されているため禁止語扱いしない"
    },
    {
      "id": "no-flag-seihon-with-explicit-generation",
      "language": "ja",
      "mode": "review",
      "input": "SKILL.mdを管理上の正本とする。変更はSKILL.mdにだけ加え、ホスト別ファイルはそこから生成する。",
      "expected": "直接編集するファイルと生成方向が後続文に明示されているため、『正本』の存在だけでは指摘しない"
    },
    {
      "id": "flag-ambiguous-design-axis",
      "language": "ja",
      "mode": "review",
      "input": "可用性を設計の軸とする。",
      "must_not_claim": ["可用性を常に最優先する", "復旧時間だけで判断する", "費用は考慮しない"],
      "expected": "『軸』を禁止語扱いせず、何を比較・選択するときの基準か、競合する条件があるとき何を優先するかなど、読者の判断に必要で文脈から確定できない関係だけを候補にする"
    },
    {
      "id": "no-flag-explicit-design-axis",
      "language": "ja",
      "mode": "review",
      "input": "可用性を設計の軸とする。候補が競合する場合は、停止時間が短い案を優先することで可用性を比較する。",
      "must_preserve": ["可用性", "設計の軸", "停止時間が短い案", "優先する"],
      "expected": "比較対象と競合時の判断基準が続けて明示されているため、『軸』の存在だけでは関係の省略として指摘しない"
    },
    {
      "id": "preserve-concrete-coordinate-axis",
      "language": "ja",
      "mode": "review",
      "input": "グラフの横軸は時刻、縦軸はrequest数を示す。",
      "must_preserve": ["横軸", "時刻", "縦軸", "request数"],
      "expected": "二つの座標軸とそれぞれが示す値が具体的に定義されているため、scannerに現れてもexcludedとし、語の存在だけでは指摘しない"
    },
    {
      "id": "flag-ambiguous-decision-setting",
      "language": "ja",
      "mode": "review",
      "input": "定例会を判断の場とする。",
      "must_not_claim": ["運用責任者が判断する", "公開可否を決める", "多数決で承認する"],
      "expected": "『場』を禁止語扱いせず、誰が何を判断し、どの入力からどの結果を出すかのうち、読者の参加・判断に必要で周囲から確定できない関係を候補にする"
    },
    {
      "id": "no-flag-explicit-decision-setting",
      "language": "ja",
      "mode": "review",
      "input": "定例会を公開可否を決める場とし、運用責任者が承認または差戻しを決定する。",
      "must_preserve": ["定例会", "公開可否", "場", "運用責任者", "承認", "差戻し"],
      "expected": "判断対象、判断主体、結果が明示されているため、入力資料をこの一文に列挙していないことだけで関係の省略として指摘しない"
    },
    {
      "id": "flag-parenthetical-decision-setting",
      "language": "ja",
      "mode": "review",
      "input": "定例会を判断の場（週次レビュー）とする。",
      "must_preserve": ["判断の場", "週次レビュー"],
      "must_not_claim": ["公開可否を決める", "運用責任者が承認する"],
      "expected": "直後に補足の括弧があっても独立した『場』を関係表現candidateとして確認し、補足名だけでは確定しない判断対象や主体を創作しない"
    },
    {
      "id": "baai-basho-kaijo-are-not-tripwires",
      "language": "ja",
      "mode": "review",
      "input": "障害の場合は会場で待機し、場所を記録する。",
      "must_preserve": ["場合", "会場", "場所"],
      "expected": "『場合』『会場』『場所』に含まれる文字を関係表現candidateにせず、文章から別のreader impactが確認できない限り不要な指摘を作らない"
    },
    {
      "id": "flag-ambiguous-compatibility-assurance",
      "language": "ja",
      "mode": "review",
      "input": "CodexとCopilotの互換性を担保する。",
      "must_not_claim": ["同じSKILL.mdを読み込む", "全fixtureが成功する"],
      "expected": "対象機能、確認方法、完了条件が分からず、読者が互換性の意味を補う必要があると診断する。『担保』を『確保』へ置き換えるだけにしない"
    },
    {
      "id": "no-flag-explicit-compatibility-check",
      "language": "ja",
      "mode": "review",
      "input": "同じSKILL.mdをCodexとCopilotの双方で読み込み、代表的な評価ケースが両方で成功することを確認する。",
      "expected": "対象、確認方法、完了条件が明示されているため、関係の不足を指摘しない"
    },
    {
      "id": "flag-ambiguous-settings-reflection",
      "language": "ja",
      "mode": "review",
      "input": "設定を各環境へ反映する。",
      "must_not_claim": ["masterブランチへのマージで開始する", "ワークフローが配布する", "config/defaults.yamlが生成元である"],
      "expected": "読者の行動に必要な入力元、反映先、実行のきっかけ、実行主体のうち、文脈から必要な不足だけを指摘する。全項目を機械的に要求しない"
    },
    {
      "id": "no-flag-explicit-settings-distribution",
      "language": "ja",
      "mode": "review",
      "input": "masterブランチへマージした後、ワークフローがconfig/defaults.yamlを各環境の設定へ配布する。",
      "expected": "実行のきっかけ、主体、配布元、配布先、方向が明示されているため、不要な指摘をしない"
    },
    {
      "id": "review-does-not-guess-seihon-target",
      "language": "ja",
      "mode": "review",
      "input": "生成物と定義が異なる場合は正本に合わせる。",
      "must_not_claim": ["生成物が正本である", "定義が正本である"],
      "expected": "『正本』が生成物と定義のどちらかを推測せず、不一致時の優先先を要確認として分離する"
    },
    {
      "id": "revise-safe-explicit-generation-context",
      "language": "ja",
      "mode": "revise-safe",
      "input": "SKILL.mdだけを直接編集する。ホスト別ファイルはビルドスクリプトがSKILL.mdから生成する。SKILL.mdを正本とする。",
      "must_preserve": ["SKILL.md", "ホスト別ファイル", "ビルドスクリプト", "直接編集", "生成する"],
      "must_not_add": ["不一致時はSKILL.mdを優先する", "正式公開版"],
      "expected": "周囲から確定できる直接編集対象と生成方向だけを使い、『SKILL.mdだけを直接編集し、ホスト別ファイルはビルドスクリプトで生成する』と重複を整理する"
    },
    {
      "id": "revise-safe-keeps-ambiguous-relation",
      "language": "ja",
      "mode": "revise-safe",
      "input": "SKILL.mdを正本とする。",
      "must_preserve": ["SKILL.md", "正本"],
      "must_not_add": ["直接編集", "生成元", "優先する", "共有定義"],
      "expected": "関係を確定できないため推測して書き換えず、原文を維持して必要な関係を本文外の要確認として示す"
    },
    {
      "id": "authoring-leaves-relation-todos",
      "language": "ja",
      "mode": "authoring",
      "input": "CodexとCopilotの互換性を担保する方針を書いてください。確認方法と完了条件は未定です。",
      "must_not_add": ["全fixture", "同じ出力", "100%", "SKILL.md"],
      "expected": "互換性の対象、確認方法、完了条件を創作せず、具体化に必要なTODOとして示す"
    },
    {
      "id": "jtf-only-does-not-clarify-relation",
      "language": "ja",
      "mode": "jtf-only",
      "input": "SKILL.mdを正本とする。",
      "must_preserve": ["SKILL.mdを正本とする。"],
      "expected": "関係の明確化は行わず、表記対象がないため原文を変更しない"
    },
    {
      "id": "repository-review-distinguishes-generation-from-precedence",
      "language": "ja",
      "mode": "repository-review",
      "input": "文書は『SKILL.mdからホスト別ファイルを生成する』と記載する。リポジトリ内のビルドスクリプトと、生成されたファイルであることを示す記載は生成関係を支持するが、不一致時の優先先を定める記述はない。",
      "expected_statuses": ["VERIFIED"],
      "expected_evidence_types": ["DOC↔CODE"],
      "must_not_claim": ["不一致時はSKILL.mdを優先する", "SKILL.mdが正式公開版である", "[SCRIPT]", "[REPOSITORY]"],
      "expected": "ビルドスクリプトと、生成されたファイルであることを示す記載から生成関係だけをVERIFIEDとし、生成元を不一致時の優先先や正式版と同一視しない"
    }
  ]
}
