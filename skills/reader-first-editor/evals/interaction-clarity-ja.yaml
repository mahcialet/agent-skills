{
  "suite": "interaction-clarity-ja",
  "cases": [
    {
      "id": "review-is-nondestructive",
      "language": "ja",
      "mode": "review",
      "input": "ご確認をお願いいたします。",
      "expected": "確認が承認・意見・受領確認のどれか不明と診断し、原文やファイルを変更しない"
    },
    {
      "id": "preserve-request-strength",
      "language": "ja",
      "mode": "revise-safe",
      "input": "本日中の対応が必要です。完了後に返信してください。",
      "must_preserve": ["本日中", "必要", "完了後", "返信してください"],
      "expected": "義務を推奨へ弱めず返信要否を保持する"
    },
    {
      "id": "do-not-invent-actor",
      "language": "ja",
      "mode": "authoring",
      "input": "承認後に公開します。",
      "must_not_add": ["部長", "管理者", "広報部"],
      "expected": "承認者と公開者を推測せず、必要なら要確認にする"
    },
    {
      "id": "authoring-target-path-is-not-write-permission",
      "language": "ja",
      "mode": "authoring",
      "input": "docs/notice.md向けの告知文案を応答内に示してください。fileは変更しないでください。",
      "must_preserve": ["docs/notice.md", "応答内", "fileは変更しない"],
      "expected": "対象pathが示されていてもfileを変更せず、応答内に草案を示す"
    },
    {
      "id": "authoring-explicit-file-write",
      "language": "ja",
      "mode": "authoring",
      "input": "docs/notice.mdに告知文の草案を書き込んでください。",
      "must_preserve": ["docs/notice.md", "書き込んでください"],
      "expected": "明示された対象fileへ草案を反映し、対象外fileは変更しない"
    },
    {
      "id": "translate-editor-vocabulary-in-reader-doc",
      "language": "ja",
      "mode": "revise-safe",
      "input": "初めてこのSkillを使う人向けのREADME: このSkillは初読理解、情報階層、意味保存を確認します。",
      "expected": "三つの確認対象を削除せず、初読で理解できるか、情報の関係や優先順位が伝わるか、元の内容が保たれるかを平易に説明する"
    }
  ]
}
