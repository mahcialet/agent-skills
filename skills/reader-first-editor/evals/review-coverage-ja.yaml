      "input": "# 設定配布手順\n\n## 1. 対象\n\nこの手順は管理者向けです。利用者IDは申請画面で確認します。ユーザーIDが見つからない場合は、処理を中止してください。\n\n接続先は `PostgreSQL` です。接続timeoutは10 秒です。\n\n## 2. 事前確認\n\n次の項目を確認します。\n\n| 項目 | 扱い |\n|---|---|\n| 接続先 | 必須 |\n| 管理者権限 | 必須 |\n| 通知先 | optional |\n\n## 3. 配布\n\n設定を確認します。権限を確認します。結果を確認します。確認後、配布処理を実行します。\n\n## 4. 障害時の扱い\n\n配布に失敗した場合は、処理を中止します。再実行の条件は運用担当者が判断します。\n\n## 5. 管理するファイル\n\n`config/base.yaml`を正本とする。\n\n## 6. 完了確認\n\n各環境で設定値を確認し、作業記録に結果を残します。",
      "must_preserve": [
        "利用者ID",
        "ユーザーID",
        "10 秒",
        "optional",
        "`config/base.yaml`を正本とする。"
      ],
      "must_not_claim": [
        "主な3件だけを確認した",
        "他に問題はない",
        "config/base.yamlだけを直接編集する",
        "config/base.yamlから各環境のファイルを生成する",
        "不一致時はconfig/base.yamlを優先する"
      ],
      "expected": "前半の『利用者ID／ユーザーID』『10 秒』『必須／optional』を候補として確認した後も探索を終了せず、第5節の『正本』を関係の省略候補として候補記録に残す。『正本』から直接編集対象、生成方向、不一致時の優先先を推測せず、周囲に関係の説明がないことを文脈で確認する。候補検出時には重大度で絞らず、各候補の位置と確認結果を保持し、任意の上位3件だけでレビュー完了としない"
