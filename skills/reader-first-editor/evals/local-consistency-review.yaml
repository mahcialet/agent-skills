{
  "suite": "local-consistency-review",
  "provenance": "2026-09-02に利用者から提示されたDB日時型の少数例事例と設計要件",
  "cases": [
    {
      "id": "unexplained-timestamp-minority",
      "language": "ja",
      "mode": "repository-review",
      "input": "DB定義表のaudit timestamps 24列のうち22列はtimestamptz、foo.published_atとbar.completed_atの2列はtimestampである。DDL、migration、column comment、testを確認したが、この2列だけ異なる理由は記載されていない。",
      "expected_statuses": ["UNSUPPORTED"],
      "expected_evidence_types": ["EVIDENCE-GAP"],
      "expected_anomaly_statuses": ["UNEXPLAINED"],
      "must_not_claim": [
        "timestampは誤り",
        "timestamptzへ変更する",
        "修正漏れである"
      ],
      "expected": "同じaudit timestamp peer groupである根拠と22対2の分布、2列のlocation、探索した証拠を示す。理由が見つからないためUNEXPLAINEDとするが、少数派だけでは誤りと断定しない"
    },
    {
      "id": "explained-local-time-exception",
      "language": "ja",
      "mode": "repository-review",
      "input": "audit timestampsの大半はtimestamptzだが、events.local_occurred_atだけtimestampである。ADR-012とcolumn commentは、外部端末が送った現地時刻をtimezoneなしで保存すると明記している。",
      "expected_statuses": ["VERIFIED"],
      "expected_evidence_types": ["DOC↔DOC", "DOC↔CODE"],
      "expected_anomaly_statuses": ["EXPLAINED"],
      "must_not_claim": [
        "timestamptzへ変更する",
        "型が不整合である"
      ],
      "expected": "少数型は意図的な例外としてEXPLAINEDにし、確認済みcandidateをcoverageへ残すが修正提案をしない"
    },
    {
      "id": "minority-contradicts-schema-policy",
      "language": "ja",
      "mode": "repository-review",
      "input": "schema policyとtestはaudit timestampをtimestamptzに限定しているが、events.completed_atだけtimestampである。例外を認める記述はない。",
      "expected_statuses": ["CONTRADICTED"],
      "expected_evidence_types": ["DOC↔CODE", "DOC↔TEST"],
      "expected_anomaly_statuses": ["CONTRADICTED"],
      "must_not_claim": ["少数派だから誤り"],
      "expected": "少数派であることではなく、明示policyとtestへの具体的な矛盾を根拠にCONTRADICTEDとする。anomaly_statusとevidence_statusを別fieldで記録する"
    },
    {
      "id": "different-peer-groups-are-not-compared",
      "language": "ja",
      "mode": "review",
      "input": "| column | type |\n|---|---|\n| created_at | timestamptz |\n| updated_at | timestamptz |\n| birth_date | date |\n| local_time | timestamp |",
      "expected_anomaly_statuses": ["NOT-AN-OUTLIER"],
      "must_not_claim": [
        "dateは少数派なので不整合",
        "timestampはtimestamptzへ統一する"
      ],
      "expected": "監査日時、暦日、利用者の現地時刻をglobal frequencyだけで同じpeer groupにせず、少数派という理由ではflagしない"
    },
    {
      "id": "scanner-candidates-are-contextually-excluded",
      "language": "ja",
      "mode": "review",
      "input": "署名済み契約書の正本を法務部が保管する。\n本手順では、承認済みPDFを『正本』と呼ぶ。\nSKILL.mdを管理上の正本とする。変更はSKILL.mdだけに加え、そこからホスト別fileを生成する。",
      "must_preserve": ["正本", "法務部", "承認済みPDF", "SKILL.md"],
      "expected_coverage_statuses": ["checked"],
      "expected": "scannerでは3件すべてをcandidateにする。文脈確認後、法務用語、文書内定義、生成関係が明示された用法として各locationと除外理由を残し、findingは0件とする"
    }
  ]
}
