schema_version = 1

[instances.backlog_work]
provider = "backlog"
base_url = "https://example.backlog.com"
api_key_env = "BACKLOG_API_KEY"

[instances.redmine_work]
provider = "redmine"
base_url = "https://redmine.example.invalid/redmine"
api_key_env = "REDMINE_API_KEY"

[profiles.product_a]
instance = "backlog_work"
project_id = 123
project_key = "PRODA"
read_scope = "project"
format = "markdown"
concurrency = "best_effort"

[profiles.product_a.write_allowlist]
"PRODA-123" = ["description:write", "comment:append"]
"PRODA-127" = ["comment:append"]

[profiles.infrastructure]
instance = "redmine_work"
project_id = 17
read_scope = "project"
format = "textile"
concurrency = "strict"

[profiles.infrastructure.write_allowlist]
"4821" = ["description:write", "comment:append"]

# 任意のprivateな端末内binding。同じremoteのcloneもrootごとに分けられる。
# [repositories.product_a_clone]
# root = "/home/YOU/work/product-a"
# profile = "product_a"
# workspace_id = "product-a-clone"
#
# [repositories.infrastructure_clone]
# root = "/home/YOU/work/infrastructure"
# profile = "infrastructure"
# workspace_id = "infrastructure-clone"
